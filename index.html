<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
    <meta name="theme-color" content="#07080C" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="App nativo para optimizar configuraciones, sensibilidad y HUD en Free Fire" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FullHead" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FullHead" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="msapplication-TileColor" content="#D4AA00" />
    <meta name="msapplication-TileImage" content="/favicon.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-tap-highlight" content="no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <style>
      html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      html, #root { margin: 0; padding: 0; width: 100%; min-height: 100%; background-color: #07080C; }
      body {
        margin: 0; width: 100%; min-height: 100%; background-color: #07080C;
        padding-top: 0;
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
      }
      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

      /* ── Splash nativo HTML (renderiza antes do React) ── */
    #fh-splash {
          position: fixed;
          inset: 0;
          z-index: 999999;
          background: #07080c;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, 'Inter', Arial, sans-serif;
          transition: opacity 0.45s ease, visibility 0.45s ease;
        }

        #fh-splash.fh-hidden {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }

        /* FUNDO */
        #fh-splash-bg {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }

        #fh-splash-grid {
          position: absolute;
          inset: 0;
          pointer-events: none;
          background-image:
            linear-gradient(rgba(212, 170, 0, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(212, 170, 0, 0.03) 1px, transparent 1px);
          background-size: 40px 40px;
        }

        #fh-splash-glow {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 220px;
          height: 220px;
          transform: translate(-50%, -50%);
          background: radial-gradient(circle, rgba(212, 170, 0, 0.12) 0%, transparent 70%);
          animation: fhGlowPulse 2s ease-in-out infinite alternate;
          pointer-events: none;
        }

        @keyframes fhGlowPulse {
          0% {
            opacity: 0.5;
            transform: translate(-50%, -50%) scale(0.9);
          }

          100% {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
          }
        }

        /* PARTÍCULAS */
        .fh-particle {
          position: absolute;
          border-radius: 50%;
          background: #d4aa00;
          animation: fhFloatUp linear infinite;
          opacity: 0;
        }

        @keyframes fhFloatUp {
          0% {
            transform: translateY(0) scale(1);
            opacity: 0;
          }

          10% {
            opacity: 0.6;
          }

          90% {
            opacity: 0.1;
          }

          100% {
            transform: translateY(-600px) scale(0.2);
            opacity: 0;
          }
        }

        /* RADAR */
        #fh-radar-wrap {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          pointer-events: none;
        }

        .fh-ring {
          position: absolute;
          top: 50%;
          left: 50%;
          border-radius: 50%;
          border: 1px solid rgba(212, 170, 0, 0.08);
          transform: translate(-50%, -50%);
          animation: fhRadarPulse 3s ease-out infinite;
        }

        .fh-ring:nth-child(1) {
          width: 120px;
          height: 120px;
          animation-delay: 0s;
        }

        .fh-ring:nth-child(2) {
          width: 220px;
          height: 220px;
          animation-delay: 0.6s;
        }

        .fh-ring:nth-child(3) {
          width: 340px;
          height: 340px;
          animation-delay: 1.2s;
        }

        .fh-ring:nth-child(4) {
          width: 480px;
          height: 480px;
          animation-delay: 1.8s;
        }

        .fh-ring:nth-child(5) {
          width: 620px;
          height: 620px;
          animation-delay: 2.4s;
        }

        @keyframes fhRadarPulse {
          0% {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.8);
          }

          20% {
            opacity: 1;
          }

          100% {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.1);
          }
        }

        /* LINHAS DECORATIVAS */
        #fh-corner-lines {
          position: absolute;
          inset: 0;
          pointer-events: none;
          overflow: hidden;
        }

        .fh-cl {
          position: absolute;
          width: 1px;
          background: linear-gradient(transparent, rgba(212, 170, 0, 0.15), transparent);
        }

        .fh-cl1 {
          height: 200px;
          top: 0;
          left: 30%;
          transform: rotate(15deg);
          animation: fhClDown 4s ease-in-out infinite;
        }

        .fh-cl2 {
          height: 160px;
          top: 0;
          right: 25%;
          transform: rotate(-10deg);
          animation: fhClDown2 4s ease-in-out infinite 1s;
        }

        .fh-cl3 {
          height: 180px;
          top: 0;
          left: 60%;
          transform: rotate(8deg);
          animation: fhClDown3 4s ease-in-out infinite 2s;
        }

        @keyframes fhClDown {
          0% {
            opacity: 0;
            transform: translateY(-20px) rotate(15deg);
          }

          30% {
            opacity: 1;
          }

          70% {
            opacity: 0.3;
          }

          100% {
            opacity: 0;
            transform: translateY(40px) rotate(15deg);
          }
        }

        @keyframes fhClDown2 {
          0% {
            opacity: 0;
            transform: translateY(-20px) rotate(-10deg);
          }

          30% {
            opacity: 1;
          }

          70% {
            opacity: 0.3;
          }

          100% {
            opacity: 0;
            transform: translateY(40px) rotate(-10deg);
          }
        }

        @keyframes fhClDown3 {
          0% {
            opacity: 0;
            transform: translateY(-20px) rotate(8deg);
          }

          30% {
            opacity: 1;
          }

          70% {
            opacity: 0.3;
          }

          100% {
            opacity: 0;
            transform: translateY(40px) rotate(8deg);
          }
        }

        /* CANTOS */
        .fh-corner {
          position: absolute;
          width: 22px;
          height: 22px;
          border-color: rgba(212, 170, 0, 0.22);
          border-style: solid;
          pointer-events: none;
        }

        /* CONTEÚDO CENTRAL */
        #fh-splash-center {
          position: relative;
          z-index: 2;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        /* LOGO LIMPA, SEM FUNDO, SEM BORDA, SEM GIRO */
        #fh-logo-shell {
          position: relative;
          width: auto;
          height: auto;
          margin-bottom: 24px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: transparent !important;
          border: none !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          animation: none !important;
        }

        #fh-logo-wrap {
          width: auto;
          height: auto;
          display: flex;
          align-items: center;
          justify-content: center;
          background: transparent !important;
          border: none !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          overflow: visible !important;
          animation: none !important;
        }

        #fh-logo-wrap img {
          width: 96px;
          height: auto;
          object-fit: contain;
          display: block;
          background: transparent !important;
          border: none !important;
          border-radius: 0 !important;
          box-shadow: none !important;
        }

        .fh-ring-marker {
          display: none !important;
        }

        /* TEXTOS */
        #fh-name {
          font-family: 'Barlow Condensed', 'Inter', Arial, sans-serif;
          font-size: 34px;
          font-weight: 700;
          letter-spacing: 10px;
          color: #e8ddb0;
          line-height: 1;
          margin-bottom: 6px;
          text-align: center;
          text-shadow: 0 0 30px rgba(212, 170, 0, 0.2);
        }

        #fh-sub {
          font-size: 9px;
          letter-spacing: 6px;
          color: #3a4060;
          margin-bottom: 44px;
          text-align: center;
        }

        /* BARRA */
        #fh-bar-wrap {
          width: 220px;
          margin-bottom: 16px;
        }

        #fh-bar-labels {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 8px;
          font-family: 'Barlow Condensed', 'Inter', Arial, sans-serif;
        }

        #fh-bar-label {
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 2px;
          color: #3a4060;
        }

        #fh-bar-pct {
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 2px;
          color: #d4aa00;
        }

        #fh-bar-track {
          height: 3px;
          background: #0f1220;
          border-radius: 3px;
          overflow: hidden;
          position: relative;
        }

        #fh-bar-fill {
          height: 100%;
          width: 0%;
          border-radius: 3px;
          background: linear-gradient(90deg, #8a6a00, #d4aa00, #ffe066);
          transition: width 0.3s ease;
          position: relative;
        }

        #fh-bar-fill::after {
          content: '';
          position: absolute;
          right: 0;
          top: 0;
          bottom: 0;
          width: 20px;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4));
          animation: fhShimmer 1s ease infinite;
        }

        @keyframes fhShimmer {
          0% {
            opacity: 0;
          }

          50% {
            opacity: 1;
          }

          100% {
            opacity: 0;
          }
        }

        #fh-status {
          font-size: 10px;
          font-weight: 500;
          letter-spacing: 3px;
          color: #3a4060;
          text-align: center;
          min-height: 16px;
          transition: opacity 0.3s ease;
        }

        /* MOBILE */
        @media (max-width: 480px) {
          #fh-logo-wrap img {
            width: 88px;
          }

          #fh-name {
            font-size: 30px;
            letter-spacing: 8px;
          }

          #fh-sub {
            letter-spacing: 5px;
          }

          #fh-bar-wrap {
            width: 210px;
          }
        }
      </style>
    </head>

    <!-- ── Splash nativo: renderiza ANTES do React ────────── -->
    <div id="fh-splash">
      <div id="fh-splash-bg">
        <div id="fh-splash-grid"></div>

        <!-- Partículas -->
        <span class="fh-particle" style="width:4px;height:4px;left:10%;bottom:-20px;animation-duration:8s;animation-delay:0s;"></span>
        <span class="fh-particle" style="width:3px;height:3px;left:25%;bottom:-20px;animation-duration:7s;animation-delay:1s;"></span>
        <span class="fh-particle" style="width:5px;height:5px;left:40%;bottom:-20px;animation-duration:9s;animation-delay:2s;"></span>
        <span class="fh-particle" style="width:2px;height:2px;left:55%;bottom:-20px;animation-duration:6s;animation-delay:1.5s;"></span>
        <span class="fh-particle" style="width:4px;height:4px;left:70%;bottom:-20px;animation-duration:8s;animation-delay:0.8s;"></span>
        <span class="fh-particle" style="width:3px;height:3px;left:85%;bottom:-20px;animation-duration:7s;animation-delay:2.5s;"></span>
      </div>

      <div id="fh-splash-glow"></div>

      <!-- Ondas de radar -->
      <div id="fh-radar-wrap">
        <div class="fh-ring"></div>
        <div class="fh-ring"></div>
        <div class="fh-ring"></div>
        <div class="fh-ring"></div>
        <div class="fh-ring"></div>
      </div>

      <!-- Linhas diagonais -->
      <div id="fh-corner-lines">
        <div class="fh-cl fh-cl1"></div>
        <div class="fh-cl fh-cl2"></div>
        <div class="fh-cl fh-cl3"></div>
      </div>

      <!-- Cantos -->
      <div class="fh-corner" style="top:20px;left:20px;border-width:2px 0 0 2px"></div>
      <div class="fh-corner" style="top:20px;right:20px;border-width:2px 2px 0 0"></div>
      <div class="fh-corner" style="bottom:20px;left:20px;border-width:0 0 2px 2px"></div>
      <div class="fh-corner" style="bottom:20px;right:20px;border-width:0 2px 2px 0"></div>

      <!-- Centro -->
      <div id="fh-splash-center">
        <div id="fh-logo-shell">
          <div id="fh-logo-wrap">
            <img src="/logo-fullhead.webp" alt="FullHead" onerror="this.style.display='none'" />
          </div>
        </div>

        <div id="fh-name">FULLHEAD</div>
        <div id="fh-sub">PANEL &middot; FREE FIRE</div>

        <div id="fh-bar-wrap">
          <div id="fh-bar-labels">
            <span id="fh-bar-label">INICIANDO</span>
            <span id="fh-bar-pct">0%</span>
          </div>

          <div id="fh-bar-track">
            <div id="fh-bar-fill"></div>
          </div>
        </div>

        <div id="fh-status">VERIFICANDO LICENCIA...</div>
      </div>
    </div>
    
    <!-- ─────────────────────────────────────────────────── -->

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // ── Controle do splash nativo ──────────────────────
      (function () {
        window.__splashStart = Date.now();
        var splash = document.getElementById('fh-splash');
        var fill   = document.getElementById('fh-bar-fill');
        var pctEl  = document.getElementById('fh-bar-pct');
        var status = document.getElementById('fh-status');

        // Detecção de standalone (iOS + Android)
        var isIOS        = 'standalone' in window.navigator;
        var isStandalone = (isIOS && window.navigator.standalone === true)
                        || window.matchMedia('(display-mode: standalone)').matches
                        || window.matchMedia('(display-mode: fullscreen)').matches;
        var sessionDone  = sessionStorage.getItem('fh_session_started') === '1';

        if (isStandalone) localStorage.setItem('fh_is_pwa', 'true');

        // Se não for PWA ou já mostrou nesta sessão → oculta imediatamente
        if (!isStandalone || sessionDone) {
          splash.style.display = 'none';
          window.__splashActive = false;
        } else {
          window.__splashActive = true;

          // Animação do progresso via JS (sem depender de frameworks)
          var steps = [
            { pct: 15,  txt: 'VERIFICANDO LICENCIA...' },
            { pct: 28,  txt: 'CARGANDO MÓDULOS...'    },
            { pct: 42,  txt: 'CARGANDO MÓDULOS...'    },
            { pct: 55,  txt: 'SINCRONIZANDO DATOS...' },
            { pct: 67,  txt: 'SINCRONIZANDO DATOS...' },
            { pct: 78,  txt: 'CONFIGURANDO PANEL...'  },
            { pct: 88,  txt: 'CONFIGURANDO PANEL...'  },
            { pct: 94,  txt: 'CASI LISTO...'          },
            { pct: 100, txt: '¡BIENVENIDO!'           },
          ];
          var idx = 0;
          var timer = setInterval(function () {
            if (idx >= steps.length) { clearInterval(timer); return; }
            var s = steps[idx++];
            if (fill)  fill.style.width = s.pct + '%';
            if (pctEl) pctEl.textContent = s.pct + '%';
            if (status && status.textContent !== s.txt) status.textContent = s.txt;
          }, 480);
        }

        // React chama window.__hideSplash() quando estiver pronto
        window.__hideSplash = function () {
          if (!window.__splashActive) return;
          sessionStorage.setItem('fh_session_started', '1');
          window.__splashActive = false;
          splash.classList.add('fh-hidden');
          setTimeout(function () { splash.style.display = 'none'; }, 450);
        };
      })();

      // Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js').then(function (r) {
            console.log('✅ Service Worker registrado:', r);
          }).catch(function (e) {
            console.warn('❌ Erro SW:', e);
          });
        });
      }
    </script>
  </body>
</html>
